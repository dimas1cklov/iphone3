<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5C0F3B">
<title>Pumpkin Roulette — Black Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFC83D}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3F0A2B;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 42%,#B0206A 0%,#7C1650 45%,#3F0A2B 100%);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* the stage is scaled so a 390x810 design area always fits, and the background fills every pixel */
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
.pane{position:absolute;left:var(--dx,0px);top:var(--dy,0px);width:390px;height:810px}
.abs{position:absolute}
.lilita{font-family:'Lilita One',system-ui,sans-serif;font-weight:400}

@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes swayBig{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0deg)}100%{transform:translate3d(0,1100px,0) rotate(560deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes flapL{from{transform:rotate(-125deg)}to{transform:rotate(0deg)}}
@keyframes flapR{from{transform:rotate(125deg)}to{transform:rotate(0deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes phoneDrop{0%{transform:translateY(-900px) rotate(-10deg)}100%{transform:translateY(172px) rotate(0deg)}}
@keyframes squash{0%{transform:scale(1,1)}35%{transform:translateY(6px) scale(1.07,.88)}70%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
@keyframes driveAway{0%{transform:translateX(0) rotate(0deg)}22%{transform:translateX(-18px) rotate(-2deg)}100%{transform:translateX(calc(var(--sw,390px) + 300px)) rotate(4deg)}}
@keyframes tick{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-16deg)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes ringOut{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes blinkA{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blinkB{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glowPulse{0%,100%{opacity:.25}50%{opacity:.95}}

/* ---------- scene ---------- */
#scene{transition:opacity .5s ease}
#scene.frozen{opacity:.4}
#scene.frozen *{animation-play-state:paused !important}
.hang{position:absolute;top:calc(var(--dy,0px) * -1);display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:sway 4s ease-in-out infinite}
.hang .rope{width:2px;background:rgba(243,213,138,.6)}
#banner{left:95px;top:176px;width:200px;height:40px;z-index:3;border-radius:14px;background:#4A0B2D;border:3px solid var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;letter-spacing:1.5px;color:var(--gold)}
#pointer{left:177px;top:208px;z-index:4;transform-origin:18px 4px}
#wheelWrap{left:-20px;top:218px;width:430px;height:430px;z-index:2;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
#wheelWrap .shadow{position:absolute;inset:0;border-radius:50%;box-shadow:0 14px 26px rgba(0,0,0,.45)}
#wheelWrap .halo{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 34px 8px rgba(255,214,90,.85);animation:glowPulse 1.6s ease-in-out infinite}
#wheelRot{position:absolute;inset:0;will-change:transform}
#wheelRim{position:absolute;inset:0}
#stand{left:125px;top:636px;z-index:1}
#copy{left:0;right:0;top:706px;padding:0 28px;text-align:center}
#copy h1{margin:0;font-size:42px;line-height:1.05;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#copy p{margin:12px 0 0;font:800 19px/1.35 Nunito,sans-serif;color:var(--gold)}

/* ---------- big pumpkin ---------- */
#big{left:301px;top:calc(var(--dy,0px) * -1);width:78px;z-index:5;display:flex;flex-direction:column;align-items:center;transform-origin:39px 0;animation:swayBig 4.8s ease-in-out infinite;transition:opacity .4s ease}
#rope{width:3px;background:#F3D58A;box-shadow:0 0 4px rgba(0,0,0,.35)}
#pumpkinBtn{width:78px;height:74px;margin:0;padding:0;border:0;background:transparent;cursor:grab;touch-action:none}
#pumpkinBtn svg{display:block}
#pumpkinGlow{position:absolute;left:8px;bottom:6px;width:62px;height:44px;border-radius:50%;box-shadow:0 0 26px 8px rgba(255,170,50,.8);animation:glowPulse 2.2s ease-in-out infinite;pointer-events:none}
#hint{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:bob 1.2s ease-in-out infinite}
#pullLabel{white-space:nowrap;padding:5px 12px;border-radius:999px;background:var(--gold);color:#4A0B2D;font-size:15px;line-height:1;letter-spacing:.5px;box-shadow:0 3px 0 #B07A00}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:10}
#hit{z-index:9;pointer-events:none;overflow:hidden}
#hit .flash{position:absolute;inset:0;background:#FFF6D6;animation:flash .7s ease-out both}
#hit .ring{position:absolute;left:195px;top:433px;width:110px;height:110px;border-radius:50%;animation:ringOut .8s ease-out both}
#won{background:rgba(30,3,20,.62);overflow:hidden}
#won .pane{display:flex;flex-direction:column;align-items:center;padding-top:84px}
#won .rays{position:absolute;left:-85px;top:66px;width:560px;height:560px;animation:sunspin 12s linear infinite}
#won h2{position:relative;margin:0;font-size:58px;line-height:1;color:var(--gold);text-shadow:0 0 22px rgba(255,200,61,.6),0 4px 0 rgba(0,0,0,.35);animation:pop .6s ease-out both,pulse 1s ease-in-out .6s infinite}
#won p{position:relative;margin:10px 0 0;font:800 20px/1.3 Nunito,sans-serif;animation:rise .5s ease-out .15s both}
#won img{position:relative;margin-top:22px;width:230px;height:280px;object-fit:contain;animation:pop .7s ease-out .2s both,wiggle 1.4s ease-in-out .9s infinite}
.goldBtn{position:relative;margin-top:30px;padding:16px 52px;border:0;border-radius:16px;background:var(--gold);color:#4A0B2D;font-size:26px;line-height:1;letter-spacing:.5px;box-shadow:0 6px 0 #B07A00,0 12px 24px rgba(0,0,0,.35);cursor:pointer;animation:rise .5s ease-out .5s both}
.goldBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #B07A00}

#formWrap{background:rgba(30,3,20,.6)}
#contactForm{position:absolute;left:26px;right:26px;top:134px;background:#fff;border-radius:22px;padding:26px 22px 24px;box-shadow:0 24px 50px rgba(0,0,0,.45);color:#1B1B1F;display:flex;flex-direction:column;gap:14px;animation:pop .5s ease-out both}
#formWrap.typing #contactForm{top:18px}
#contactForm{transition:top .25s ease}
#contactForm h2{margin:0;font-size:30px;line-height:1.1;color:#8E1A55;text-align:center}
#contactForm .sub{margin:6px 0 0;font:700 15px/1.35 Nunito,sans-serif;color:#55555E;text-align:center}
.fieldBox{display:flex;flex-direction:column;gap:6px}
.fieldBox label{font:800 14px/1 Nunito,sans-serif}
.field{width:100%;height:48px;background:#E3E3E8;border:2px solid transparent;border-radius:10px;padding:0 14px;font:700 16px/1 Nunito,system-ui,sans-serif;color:#1B1B1F;outline:none;transition:border-color .2s,background .2s;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.field::placeholder{color:#5D5D66}
.field:focus{border-color:#8E1A55;background:#fff}
.accTitle{font:800 13px/1 Nunito,sans-serif;letter-spacing:1.2px;text-align:center}
.accRow{display:flex;gap:14px;justify-content:center}
.acc{position:relative;width:66px;height:66px;border-radius:14px;border:2px solid transparent;background:#E3E3E8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .2s,border-color .2s}
.acc[aria-pressed="true"]{background:#C9F7D9;border-color:#16A34A}
.acc .check{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#16A34A;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.acc[aria-pressed="true"] .check{display:flex}
#formError{margin:0;text-align:center;font:800 14px/1.3 Nunito,sans-serif;color:#B3123E}
#confirmBtn{margin-top:6px;height:54px;border:0;border-radius:14px;background:#22D45E;color:#06301A;font-size:24px;line-height:1;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 0 #149A42}
#confirmBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #149A42}

#ship{background:rgba(30,3,20,.6);text-align:center;overflow:hidden}
#shipHead{position:absolute;left:0;right:0;top:250px;padding:0 30px;animation:rise .5s ease-out 2.2s both}
#shipHead h2{margin:0;font-size:36px;line-height:1.08;color:#fff;text-shadow:0 0 18px rgba(255,200,61,.55),0 3px 0 rgba(0,0,0,.35)}
#timerBtn{margin-top:14px;padding:4px 10px;border:0;background:transparent;cursor:pointer;font-size:66px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(255,200,61,.6),0 4px 0 rgba(0,0,0,.35)}
#box{position:absolute;left:45px;top:380px;width:300px;height:340px;transform-origin:50% 100%;animation:squash .35s ease-out .65s both,driveAway .75s cubic-bezier(.55,0,.85,.35) 1.5s forwards}
#box .shadow{position:absolute;left:20px;right:20px;bottom:-14px;height:22px;border-radius:50%;background:rgba(0,0,0,.35)}
#box .inside{position:absolute;left:34px;top:150px;width:232px;height:26px;border-radius:4px;background:#4A2E12}
#box .phone{position:absolute;left:85px;top:0;width:130px;height:auto;animation:phoneDrop .5s cubic-bezier(.55,0,1,.45) .15s both}
#box .front{position:absolute;left:30px;top:168px;width:240px;height:170px;border-radius:6px;background:#CF9650;box-shadow:inset 0 8px 0 #B87E3D,inset 0 -40px 0 #BE8441}
#box .flap{position:absolute;top:144px;width:120px;height:26px;border-radius:3px;background:#DDA765;box-shadow:inset 0 0 0 1.5px #B87E3D}
#box .flapL{left:30px;transform-origin:0 100%;animation:flapL .28s ease-in .85s both}
#box .flapR{left:150px;transform-origin:100% 100%;animation:flapR .28s ease-in .85s both}
#box .tape{position:absolute;left:134px;top:140px;width:32px;height:70px;background:#EBC98F;box-shadow:0 1px 2px rgba(0,0,0,.2);animation:fadeIn .2s ease-out 1.15s both}
#replayBtn{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);min-height:44px;padding:0 22px;border:2px solid rgba(255,255,255,.55);border-radius:999px;background:transparent;color:#fff;font:800 15px/1 Nunito,sans-serif;cursor:pointer;white-space:nowrap;animation:fadeIn .4s ease-out 2.5s both}

#confetti{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:0;border-radius:2px;animation:fall 4s linear infinite}

button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.hang,#big,#hint,#confetti i{animation:none !important}}
</style>
</head>

<div id="stage">

  <!-- web in the corner of the whole screen -->
  <svg aria-hidden="true" width="140" height="140" viewBox="0 0 140 140" class="abs" style="left:0;top:0">
    <g stroke="rgba(255,255,255,.22)" stroke-width="1.2" fill="none">
      <path d="M0 0 L140 0 M0 0 L129 54 M0 0 L99 99 M0 0 L54 129 M0 0 L0 140"/>

  <!-- ============ SCENE ============ -->
  <div id="scene">

<script>
(function () {
  'use strict';
  var SPIN_SECONDS = 3.2;     // spin length
  var WIN_ANGLE = 120;        // red iPhone sector (0 = blue at top, clockwise, 60 degrees per sector)
  var ROPE = 168;             // rope length at rest, px
  var DESIGN_W = 390, DESIGN_H = 810;
  var START_SECS = 2 * 3600 + 59 * 60 + 59;

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), stage = $('stage'), wheelRot = $('wheelRot'), rope = $('rope'), pointer = $('pointer');
  var phase = 'idle', pull = 0, dragging = false, y0 = 0, scale = 1;
  var timers = [], iv = null, secs = START_SECS;

  /* ---- fill ANY screen: scale the 390x810 design to fit, stretch the background to all edges ---- */
  var typing = false;
  function fit() {
    if (typing) return;   // keyboard is open: keep the layout exactly as it was
    var vv = window.visualViewport;
    var w = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth);
    var h = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight);
    var s = Math.min(w / DESIGN_W, h / DESIGN_H);
    var sw = w / s, sh = h / s;
    stage.style.width = sw + 'px';
    stage.style.height = sh + 'px';
    stage.style.transform = 'scale(' + s + ')';
    stage.style.setProperty('--dx', ((sw - DESIGN_W) / 2) + 'px');
    stage.style.setProperty('--dy', ((sh - DESIGN_H) / 2) + 'px');
    stage.style.setProperty('--sw', sw + 'px');
    app.style.height = h + 'px';
    setPull(pull, false, true);
  }
  function glue() {
    var vv = window.visualViewport;
    if (typing && vv) { app.style.top = vv.offsetTop + 'px'; app.style.left = vv.offsetLeft + 'px'; }
    else { app.style.top = '0px'; app.style.left = '0px'; }
    if (typing) window.scrollTo(0, 0);
  }
  window.addEventListener('resize', function () { fit(); glue(); });
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { fit(); glue(); });
    window.visualViewport.addEventListener('scroll', glue);
  }
  document.addEventListener('focusin', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('field')) {
      typing = true; $('formWrap').classList.add('typing'); glue();
    }
  });
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      var a = document.activeElement;
      if (a && a.classList && a.classList.contains('field')) return;
      typing = false; $('formWrap').classList.remove('typing'); glue(); fit();
    }, 250);
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { if (e.target.closest && !e.target.closest('#contactForm')) e.preventDefault(); }, { passive: false });

  /* ---- pumpkin art ---- */
  function pumpkinSVG(w, face) {
    return '<svg aria-hidden="true" viewBox="0 0 100 92" width="' + w + '" height="' + Math.round(w * 0.92) + '">' +
      '<path d="M47 22 C45 11 50 4 59 2 L63 8 C58 10 56 15 57 22 Z" fill="#3F6B2B"/>' +
      '<ellipse cx="21" cy="57" rx="18" ry="29" fill="#D4600C"/><ellipse cx="79" cy="57" rx="18" ry="29" fill="#D4600C"/>' +
      '<ellipse cx="36" cy="55" rx="22" ry="33" fill="#EE7A14"/><ellipse cx="64" cy="55" rx="22" ry="33" fill="#EE7A14"/>' +
      '<ellipse cx="50" cy="55" rx="19" ry="34" fill="#FF9A2E"/>' +
      '<path d="M35 24 Q29 55 35 86 M65 24 Q71 55 65 86" stroke="#B94F08" stroke-width="1.6" fill="none" opacity=".6"/>' +
      (face ? '<g fill="#FFD84D"><path d="M30 52 L44 52 L37 40 Z M56 52 L70 52 L63 40 Z M46 61 L54 61 L50 55 Z"/>' +
              '<path d="M30 67 L38 73 L44 67 L50 74 L56 67 L62 73 L70 67 L66 80 Q50 88 34 80 Z"/></g>' : '') +
      '</svg>';
  }
  [
    { cx: 30, size: 54, len: 70, face: true, dur: 4.2, delay: -1 },
    { cx: 102, size: 38, len: 24, face: false, dur: 3.6, delay: -2 },
    { cx: 166, size: 48, len: 70, face: false, dur: 4.6, delay: -0.5 },
    { cx: 238, size: 42, len: 92, face: true, dur: 3.9, delay: -2.6 },
    { cx: 300, size: 36, len: 46, face: false, dur: 3.3, delay: -1.4 }
  ].forEach(function (p) {
    var d = document.createElement('div');
    d.className = 'hang';
    d.style.left = (p.cx - p.size / 2) + 'px';
    d.style.width = p.size + 'px';
    d.style.animationDuration = p.dur + 's';
    d.style.animationDelay = p.delay + 's';
    d.innerHTML = '<div class="rope" style="height:calc(' + p.len + 'px + var(--dy,0px))"></div>' + pumpkinSVG(p.size, p.face);
    $('bgPumpkins').appendChild(d);
  });

  /* ---- sun rays behind JACKPOT ---- */
  (function () {
    var s = '';
    for (var i = 0; i < 10; i++) {
      var a1 = (i * 36) * Math.PI / 180, a2 = (i * 36 + 17) * Math.PI / 180;
      s += '<polygon points="280,280 ' + (280 + 300 * Math.sin(a1)).toFixed(1) + ',' + (280 - 300 * Math.cos(a1)).toFixed(1) + ' ' +
           (280 + 300 * Math.sin(a2)).toFixed(1) + ',' + (280 - 300 * Math.cos(a2)).toFixed(1) + '"/>';
    }
    $('rayPolys').innerHTML = s;
  })();

  /* ---- confetti (lightweight: transform-only animation) ---- */
  (function () {
    function rand(n) { var v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }
    var colors = ['#FFC83D', '#FF6FA5', '#FFFFFF', '#FF8A2B', '#5EF0A0'], html = '';
    for (var i = 0; i < 24; i++) {
      html += '<i style="left:' + (rand(i) * 100).toFixed(1) + '%;width:' + (5 + rand(i + 50) * 5).toFixed(1) +
        'px;height:' + (8 + rand(i + 90) * 8).toFixed(1) + 'px;background:' + colors[i % 5] +
        ';animation-duration:' + (3 + rand(i + 3) * 3).toFixed(2) + 's;animation-delay:' + (-rand(i + 9) * 5).toFixed(2) + 's"></i>';
    }
    $('confetti').innerHTML = html;
  })();

  /* ---- helpers ---- */
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; if (iv) { clearInterval(iv); iv = null; } }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function renderTimer() {
    $('countdown').textContent = pad(Math.floor(secs / 3600)) + ':' + pad(Math.floor((secs % 3600) / 60)) + ':' + pad(secs % 60);
  }
  function setPull(v, springBack, keepLabel) {
    pull = v;
    rope.style.transition = springBack ? 'height .5s cubic-bezier(.3,1.8,.4,1)' : 'none';
    rope.style.height = 'calc(' + (ROPE + v) + 'px + var(--dy,0px))';
    if (!keepLabel) $('pullLabel').textContent = dragging ? (pull >= 55 ? 'LET GO!' : 'MORE!') : 'PULL';
  }

  function setPhase(p) {
    phase = p;
    var live = (p === 'idle' || p === 'spinning' || p === 'hit');
    // no blur anywhere: blurring a live animated scene crashes mobile browsers. We dim with an overlay and pause instead.
    $('scene').className = live ? '' : 'frozen';
    $('big').style.opacity = (p === 'idle' || p === 'spinning') ? '1' : '0';
    $('big').style.visibility = (p === 'idle' || p === 'spinning') ? 'visible' : 'hidden';
    $('big').style.pointerEvents = p === 'idle' ? 'auto' : 'none';
    $('copyIdle').hidden = p !== 'idle';
    $('copySpin').hidden = p !== 'spinning';
    $('hit').hidden = p !== 'hit';
    $('won').hidden = p !== 'won';
    $('formWrap').hidden = p !== 'form';
    $('ship').hidden = p !== 'ship';
    $('confetti').hidden = !(p === 'won' || p === 'form' || p === 'ship');
    $('wheelWrap').style.transform = p === 'hit' ? 'scale(1.07)' : 'scale(1)';
  }

  /* ---- spin ---- */
  function startSpin() {
    if (phase !== 'idle') return;
    var rot = 360 * 9 - WIN_ANGLE + (Math.random() * 30 - 15);
    wheelRot.style.transition = 'transform ' + SPIN_SECONDS + 's cubic-bezier(.1,.75,.2,1.004)';
    wheelRot.style.transform = 'rotate(' + rot + 'deg)';
    var fast = Math.round(SPIN_SECONDS * 0.55 / 0.08), slow = Math.round(SPIN_SECONDS * 0.4 / 0.22);
    pointer.style.animation = 'tick .08s ease-in-out ' + fast + ', tick .22s ease-in-out ' + (SPIN_SECONDS * 0.55) + 's ' + slow;
    dragging = false;
    setPhase('spinning');
    setPull(96, true);
    later(function () { setPull(0, true); }, 170);
    later(function () { pointer.style.animation = 'none'; setPhase('hit'); }, SPIN_SECONDS * 1000 + 60);
    later(function () { setPhase('won'); }, SPIN_SECONDS * 1000 + 1000);
  }

  /* ---- pull the pumpkin ---- */
  var btn = $('pumpkinBtn');
  btn.addEventListener('pointerdown', function (e) {
    if (phase !== 'idle') return;
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    y0 = e.clientY;
    scale = (btn.getBoundingClientRect().height / (btn.offsetHeight || 1)) || 1;
    dragging = true;
    btn.style.cursor = 'grabbing';
    setPull(0, false);
  });
  btn.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    setPull(Math.max(0, Math.min(110, (e.clientY - y0) / scale)), false);
  });
  function release() {
    if (!dragging) return;
    var p = pull;
    dragging = false;
    btn.style.cursor = 'grab';
    if (p >= 55 || p < 8) startSpin(); else setPull(0, true);
  }
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', function () { dragging = false; setPull(0, true); });
  btn.addEventListener('click', function (e) { if (e.detail === 0) startSpin(); }); // keyboard

  /* ---- won -> form ---- */
  $('takeBtn').addEventListener('click', function () { setPhase('form'); });

  Array.prototype.forEach.call(document.querySelectorAll('.acc'), function (b) {
    b.addEventListener('click', function () {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    });
  });

  $('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = $('prName').value.trim(), m = $('prEmail').value.trim();
    if (!n || m.indexOf('@') < 1) { $('formError').hidden = false; return; }
    $('formError').hidden = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    typing = false; $('formWrap').classList.remove('typing'); glue();
    secs = START_SECS; renderTimer();
    setPhase('ship');
    iv = setInterval(function () { secs = Math.max(0, secs - 1); renderTimer(); }, 1000);
  });

  /* ---- restart (timer tap or Spin again) ---- */
  function reset() {
    clearAll();
    wheelRot.style.transition = 'none';
    wheelRot.style.transform = 'rotate(0deg)';
    pointer.style.animation = 'none';
    dragging = false;
    setPull(0, false);
    $('contactForm').reset();
    $('formError').hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll('.acc'), function (b) { b.setAttribute('aria-pressed', 'false'); });
    secs = START_SECS; renderTimer();
    setPhase('idle');
  }
  $('timerBtn').addEventListener('click', reset);
  $('replayBtn').addEventListener('click', reset);

  fit();
  setPhase('idle');
})();
</script>
</body>
</html>
